services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: five-against-five:local
    container_name: five-against-five
    ports:
      - "43127:43127"
    environment:
      NODE_ENV: production
      PORT: "43127"
      HOSTNAME: "0.0.0.0"
    init: true
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./.data:/app/.data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43127/api/game?role=play').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
